repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1024']
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 0.17.0
    hooks:
      - id: ruff-check
  - repo: local
    hooks:
      - id: run-tests
        name: Run pytests
        entry: python scripts/run_tests.py
        language: system
        types: [python]
        pass_filenames: true
