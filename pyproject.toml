[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "streamstats"
version = "0.1.0"
requires-python = ">= 3.11"
description = "Lab02: JSONL and CSV statistics utility"
readme = "README.md"
dependencies = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = "tests"
